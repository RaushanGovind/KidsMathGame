<div id="additionContent">
    <!-- Bubble Matrix Section -->
    <div class="bubble-section">
        <div class="bubble-controls">
            <button id="toggleBubbles" class="bubble-toggle-btn">Show Bubbles</button>
            <button id="resetBubbles" class="bubble-reset-btn">Reset Bubbles</button>
            <span id="bubbleCounter" class="bubble-counter">Selected: 0</span>
        </div>
        <div id="bubbleMatrix" class="bubble-matrix">
            <!-- Bubbles will be generated by JavaScript -->
        </div>
    </div>

    <div id="additionColumns" class="columns"></div>

    <!-- Buttons row below the answer -->
    <div id="mainActionButtons" class="button-row">
        <button id="nextBtn" class="btn-action">Next Question</button>
        <button id="checkBtn" class="btn-action btn-check">Check Answer</button>
    </div>

    <!-- Result message display -->
    <div id="resultMsg" style="margin-top: 15px; font-size: 18px; font-weight: bold;"></div>
</div>
