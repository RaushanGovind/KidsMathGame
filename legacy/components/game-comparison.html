<div id="comparisonArea" class="comparison-wrapper" style="display: none;">
    <div class="activity-tabs">
        <button class="activity-tab active" data-activity="compare">🐊 Compare</button>
        <button class="activity-tab" data-activity="order">🔢 Order</button>
        <button class="activity-tab" data-activity="bigsmall">🌟 Big/Small</button>
        <button class="activity-tab" data-activity="placevalue">🏗️ Place Value</button>
    </div>

    <div id="comparisonContent" class="comparison-content">
        <!-- Dynamic Content for each activity -->
    </div>

    <div class="stats-container" style="display: none;">
        <div class="stat-chip">⭐ Stars: <span id="compStars">0</span></div>
        <div class="stat-chip">🏆 Level: <span id="compLevel">Easy</span></div>
    </div>

    <div class="progress-bar" style="display: none;">
        <div id="compProgress" class="progress-fill"></div>
    </div>
</div>
