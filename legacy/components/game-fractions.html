<div id="fractionsArea" class="fractions-wrapper" style="display: none;">
    <div class="fraction-badge">Learn Fractions</div>

    <div class="fraction-main-display">
        <!-- Visual Model -->
        <div class="fraction-visual-container">
            <div id="fractionVisual"></div>
            <div class="fraction-mascot">🍕</div>
        </div>

        <!-- The Fraction Card (1/2) -->
        <div class="fraction-card">
            <div class="fraction-number">
                <span id="fractNumerator">1</span>
                <div class="fraction-line"></div>
                <span id="fractDenominator">2</span>
            </div>
            <div class="fraction-meaning" id="fractMeaning">One part out of two equal parts</div>
        </div>
    </div>

    <!-- Previews for Learn Mode -->
    <div id="fractionPreviews" class="fraction-previews">
        <!-- Level picks -->
    </div>

    <!-- Question Mode Grid -->
    <div id="fractionChoices" class="fraction-choices" style="display: none;">
        <!-- Generated by JS -->
    </div>

    <div class="fraction-controls">
        <button class="time-btn fract-btn active" onclick="setFractionMode('learn')">Learn</button>
        <button class="time-btn fract-btn" onclick="setFractionMode('question')">Question</button>
        <button class="time-btn" onclick="setFractionShape('pizza')">🍕 Pizza</button>
        <button class="time-btn" onclick="setFractionShape('rectangle')">🍫 Choco</button>
    </div>
</div>
