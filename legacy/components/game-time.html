<div id="timeArea" class="time-wrapper" style="display: none;">
    <div class="learning-badge">Learn Mode</div>

    <div class="clock-container">
        <div class="clock-face" id="clockFace">
            <!-- Tick marks and numbers generated by JS -->
            <div class="hand hour-hand" id="hourHand"></div>
            <div class="hand minute-hand" id="minuteHand"></div>
            <div class="hand-center"></div>
        </div>
    </div>

    <div class="time-ui-card">
        <div class="digital-time" id="digitalTime">6:30</div>
        <div class="time-label" id="timeLabel">Half Past Six</div>
    </div>

    <div class="time-controls">
        <button class="time-btn active" onclick="setTimeMode('learn')">Learn</button>
        <button class="time-btn" onclick="setTimeMode('question')">Question</button>
        <button class="time-btn" onclick="nextTimeQuestion()">Next Time</button>
    </div>

    <div id="timeChoicesGrid" class="time-choices-grid" style="display: none;">
        <!-- Quiz options generated by JS -->
    </div>
</div>
