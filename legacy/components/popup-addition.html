<div id="addPopup" class="popup">
    <div class="popup-box">
        <button class="popup-close-btn" onclick="closeAddPopup()">✕</button>

        <h3>➕ Addition Options</h3>

        <!-- Carry Mode Selection with Toggle Buttons -->
        <div class="mode-selection-section">
            <h4>🎯 Choose Difficulty:</h4>
            <div class="toggle-buttons">
                <button class="toggle-btn active" data-carry="no" id="addNoCarry">
                    <span class="toggle-icon">😊</span>
                    <span class="toggle-text">Without Carry</span>
                    <span class="toggle-label">Easy</span>
                </button>
                <button class="toggle-btn" data-carry="yes" id="addWithCarry">
                    <span class="toggle-icon">🎓</span>
                    <span class="toggle-text">With Carry</span>
                    <span class="toggle-label">Challenge</span>
                </button>
            </div>
        </div>

        <div class="quick-selection-section">
            <h4>Quick Selection:</h4>
            <div class="quick-selection-grid">
                <button class="quick-select-btn" data-digits="1" data-rows="2">1 × 2</button>
                <button class="quick-select-btn" data-digits="2" data-rows="2">2 × 2</button>
                <button class="quick-select-btn" data-digits="3" data-rows="2">3 × 2</button>
                <button class="quick-select-btn" data-digits="2" data-rows="3">2 × 3</button>
                <button class="quick-select-btn" data-digits="3" data-rows="3">3 × 3</button>
                <button class="quick-select-btn" data-digits="1" data-rows="3">1 × 3</button>
            </div>
            <p class="selection-hint">Format: Digits × Rows (e.g., 2×2 = 2 digits, 2 numbers)</p>
        </div>

        <div class="popup-actions">
            <button id="addCancel">Cancel</button>
        </div>

    </div>
</div>
