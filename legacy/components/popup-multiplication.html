<div id="multPopup" class="popup">
    <div class="popup-box">
        <button class="popup-close-btn" onclick="closeMultPopup()">✕</button>

        <h3>✖️ Multiplication Options</h3>

        <!-- Carry Mode Selection with Toggle Buttons -->
        <div class="mode-selection-section">
            <h4>🎯 Choose Difficulty:</h4>
            <div class="toggle-buttons">
                <button class="toggle-btn active" data-carry="no" id="multNoCarry">
                    <span class="toggle-icon">😊</span>
                    <span class="toggle-text">Without Carry</span>
                    <span class="toggle-label">Easy</span>
                </button>
                <button class="toggle-btn" data-carry="yes" id="multWithCarry">
                    <span class="toggle-icon">🎓</span>
                    <span class="toggle-text">With Carry</span>
                    <span class="toggle-label">Challenge</span>
                </button>
            </div>
        </div>

        <div class="quick-selection-section">
            <h4>Quick Selection:</h4>
            <div class="quick-selection-grid mult-grid">
                <button class="quick-select-btn mult-select-btn" data-d1="1" data-d2="1">1 × 1</button>
                <button class="quick-select-btn mult-select-btn" data-d1="2" data-d2="1">2 × 1</button>
                <button class="quick-select-btn mult-select-btn" data-d1="3" data-d2="1">3 × 1</button>
                <button class="quick-select-btn mult-select-btn" data-d1="4" data-d2="1">4 × 1</button>

                <button class="quick-select-btn mult-select-btn" data-d1="2" data-d2="2">2 × 2</button>
                <button class="quick-select-btn mult-select-btn" data-d1="3" data-d2="2">3 × 2</button>
                <button class="quick-select-btn mult-select-btn" data-d1="4" data-d2="2">4 × 2</button>
            </div>
            <p class="selection-hint">Format: Top × Bottom (e.g., 2×1 = 2 digits × 1 digit)</p>
        </div>

        <div class="popup-actions">
            <button id="multCancel">Cancel</button>
        </div>

    </div>
</div>
