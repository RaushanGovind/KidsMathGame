<div id="tablePopup" class="popup">
    <div class="popup-box table-popup-box">
        <button class="popup-close-btn" onclick="closeTablePopup()">✕</button>

        <h3>📊 Choose Your Table</h3>
        <p class="table-hint">Choose Mode & Number:</p>

        <div class="table-mode-switch" style="display:flex; justify-content:center; gap:20px; margin-bottom:15px;">
            <label class="mode-label">
                <input type="radio" name="tableMode" value="practice" checked onchange="setTableMode('practice')">
                <span>✍️ Practice</span>
            </label>
            <label class="mode-label">
                <input type="radio" name="tableMode" value="reading" onchange="setTableMode('reading')">
                <span>📖 Reading</span>
            </label>
        </div>

        <div class="table-grid-selector">
            <!-- Grid will be generated by JavaScript for 1-20 -->
        </div>

        <div class="popup-actions">
            <button id="tableCancel">Cancel</button>
        </div>

    </div>
</div>
