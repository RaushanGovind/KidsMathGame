<div id="preschoolArea" class="preschool-wrapper" style="display: none;">
    <div class="preschool-header">
        <h2 class="preschool-title">🧒 Preschool Fun</h2>
    </div>

    <div class="preschool-menu">
        <button class="preschool-btn active" data-game="beads" onclick="startPreschoolGame('beads')">
            <span class="p-icon">📿</span>
            <span>Bead Counter</span>
        </button>
        <button class="preschool-btn" data-game="missing" onclick="startPreschoolGame('missing')">
            <span class="p-icon">❓</span>
            <span>Missing Number</span>
        </button>
        <button class="preschool-btn" data-game="patterns" onclick="startPreschoolGame('patterns')">
            <span class="p-icon">🎨</span>
            <span>Complete Pattern</span>
        </button>
        <button class="preschool-btn" data-game="sequence" onclick="startPreschoolGame('sequence')">
            <span class="p-icon">📏</span>
            <span>Small to Big</span>
        </button>
        <button class="preschool-btn" data-game="leftright" onclick="startPreschoolGame('leftright')">
            <span class="p-icon">👐</span>
            <span>Left & Right</span>
        </button>
        <button class="preschool-btn" data-game="sorting" onclick="startPreschoolGame('sorting')">
            <span class="p-icon">🧺</span>
            <span>Sorting Fun</span>
        </button>
        <button class="preschool-btn" data-game="weight" onclick="startPreschoolGame('weight')">
            <span class="p-icon">⚖️</span>
            <span>Heavy vs Light</span>
        </button>
    </div>

    <div id="preschoolGameCanvas" class="preschool-canvas">
        <!-- Game content goes here -->
    </div>
</div>
