<div id="schoolArea" class="school-wrapper" style="display: none;">
    <div class="school-header">
        <h2 class="school-title">🎒 Math Adventures (Class 1-2)</h2>
    </div>

    <div class="school-menu">
        <button class="school-btn active" data-game="placevalue" onclick="startSchoolGame('placevalue')">
            <span class="s-icon">🏗️</span>
            <span>Place Value</span>
        </button>
        <button class="school-btn" data-game="bonds" onclick="startSchoolGame('bonds')">
            <span class="s-icon">🔗</span>
            <span>Make 10</span>
        </button>
        <button class="school-btn" data-game="shop" onclick="startSchoolGame('shop')">
            <span class="s-icon">🛒</span>
            <span>Little Shop</span>
        </button>
        <button class="school-btn" data-game="story" onclick="startSchoolGame('story')">
            <span class="s-icon">📖</span>
            <span>Math Stories</span>
        </button>
    </div>

    <div id="schoolGameCanvas" class="school-canvas">
        <!-- Game content goes here -->
    </div>
</div>
