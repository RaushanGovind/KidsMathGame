<div id="toddlerArea" class="toddler-wrapper" style="display: none;">
    <div class="toddler-header">
        <h2 class="toddler-title">👶 Toddler Playground</h2>
    </div>

    <div class="toddler-menu">
        <button class="toddler-btn" data-game="ballpit" onclick="startToddlerGame('ballpit')">
            <span class="t-icon">🥎</span>
            <span>Ball Pit</span>
        </button>
        <button class="toddler-btn" data-game="sandpit" onclick="startToddlerGame('sandpit')">
            <span class="t-icon">🏖️</span>
            <span>Sandpit</span>
        </button>
        <button class="toddler-btn" data-game="music" onclick="startToddlerGame('music')">
            <span class="t-icon">🐘</span>
            <span>Jungle Dance</span>
        </button>
        <button class="toddler-btn" data-game="counting" onclick="startToddlerGame('counting')">
            <span class="t-icon">🍎</span>
            <span>Counting</span>
        </button>
    </div>

    <div id="toddlerGameCanvas" class="toddler-canvas">
        <!-- Game content goes here -->
    </div>
</div>
